services:
  - type: web
    name: aquantica-laravel
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Aquantica
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Secret: set this in the Render dashboard (Environment). Format: base64:...
      - key: APP_KEY
        sync: false
      # Public URL of the service, e.g. https://aquantica-laravel.onrender.com
      - key: APP_URL
        sync: false
      - key: APP_LOCALE
        value: es
      - key: APP_FALLBACK_LOCALE
        value: en
      # No database: keep sessions/cache on the filesystem and run queues inline.
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stack
      # Contact form: "log" writes mails to the log so the form works without SMTP.
      # Switch to smtp + MAIL_* vars later to actually deliver contact emails.
      - key: MAIL_MAILER
        value: log
